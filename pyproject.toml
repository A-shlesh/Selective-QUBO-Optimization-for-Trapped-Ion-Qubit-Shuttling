[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "selective-qubo-shuttling"
version = "0.1.0"
description = "Selective QUBO Optimization for Trapped-Ion Qubit Shuttling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bqskit>=1.2.1",
    "networkx>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
